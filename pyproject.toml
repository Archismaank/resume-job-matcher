[project]
name = "resume-job-matcher"
version = "0.1.0"
description = "AI agent that compares your resume against a job posting and gives match analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.37.0",
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "streamlit-extras>=1.6.0",
    "plotly>=6.8.0",
    "playwright-stealth>=2.0.3",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
